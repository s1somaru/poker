<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
        <meta charset="UTF-8">
        <title>ユーザー登録</title>
</head>

<body>
        <h1>ユーザー登録</h1>
        <form th:action="@{/register}" method="post">
                <label for="username">ユーザー名</label>
                <input id="username" name="username" type="text" th:value="${username}" required>
                <button type="submit">登録</button>
        </form>
</body>

</html>

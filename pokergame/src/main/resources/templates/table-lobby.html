<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>対戦テーブル</title>
</head>

<body>
  <h1>対戦テーブル</h1>

  <ul>
    <li th:each="seat, stat : ${seats}" th:text="'席' + ${stat.count} + '：' + (${seat} ?: '空席')"></li>
  </ul>

  <p th:text="'参加人数：' + ${participantCount} + ' / ' + ${seatCount}"></p>
  <p th:if="${waiting}">4人揃うまで待機中</p>
</body>

</html>
